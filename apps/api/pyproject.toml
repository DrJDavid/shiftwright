[project]
name = "shiftwright-api"
version = "0.1.0"
description = "FastAPI app, chat agent loop, messenger (WS6)."
requires-python = ">=3.12"
dependencies = [
  "shiftwright-contracts",
  "shiftwright-laws",
  "shiftwright-scenarios",
  "fastapi",
  "uvicorn[standard]",
  "httpx",
  "python-multipart",
]

[tool.uv.sources]
shiftwright-contracts = { workspace = true }
shiftwright-laws = { workspace = true }
shiftwright-scenarios = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

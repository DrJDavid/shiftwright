[project]
name = "shiftwright-evals"
version = "0.1.0"
description = "Engine vs baseline evals, scored by the validator (WS5)."
requires-python = ">=3.12"
dependencies = [
  "shiftwright-contracts",
  "shiftwright-scenarios",
  "shiftwright-validator",
  "shiftwright-laws",
  "httpx",
  "shiftwright-api",
]

[tool.uv.sources]
shiftwright-contracts = { workspace = true }
shiftwright-scenarios = { workspace = true }
shiftwright-validator = { workspace = true }
shiftwright-laws = { workspace = true }
shiftwright-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
